<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>claude-session-kb — architecture</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0e1a;}
</style>
</head>
<body>
<svg id="diagram" width="1500" height="780" viewBox="0 0 1500 780"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
<defs>
  <!-- arrow heads -->
  <marker id="ah-teal"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#5eead4"/></marker>
  <marker id="ah-blue"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#60a5fa"/></marker>
  <marker id="ah-violet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#a78bfa"/></marker>
  <marker id="ah-slate"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#94a3b8"/></marker>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
  </filter>
  <filter id="glow-teal" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.03"/>
  </pattern>
</defs>

<!-- background -->
<rect width="1500" height="780" fill="#0a0e1a"/>
<rect width="1500" height="780" fill="url(#dots)"/>

<!-- title -->
<text x="750" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="0.5">claude-session-kb — architecture</text>
<text x="750" y="62" text-anchor="middle" fill="#7c89a3" font-size="13">FastAPI backend reads ~/.claude-mem live; frontend renders a D3 timeline + force graph</text>

<!-- ============ SOURCE (left) ============ -->
<g>
  <rect x="60" y="320" width="240" height="120" rx="12" fill="#14213b" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="358" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="700">~/.claude-mem/</text>
  <text x="180" y="380" text-anchor="middle" fill="#c4b5fd" font-size="11">SQLite + Chroma</text>
  <text x="180" y="402" text-anchor="middle" fill="#94a3b8" font-size="10">read-only · live</text>
  <text x="180" y="424" text-anchor="middle" fill="#7c89a3" font-size="9.5" font-style="italic">observations · summaries · sessions</text>
</g>

<!-- ============ BACKEND STACK (middle) ============ -->
<g>
  <!-- group container -->
  <rect x="420" y="160" width="280" height="460" rx="14" fill="#5eead4" fill-opacity="0.04" stroke="#5eead4" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.25"/>
  <text x="430" y="183" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="2">BACKEND MODULES</text>

  <!-- store.py -->
  <rect x="450" y="210" width="220" height="78" rx="10" fill="#102a26" stroke="#5eead4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="241" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">store.py</text>
  <text x="560" y="261" text-anchor="middle" fill="#aab4c6" font-size="10.5">records · keyword search</text>
  <text x="560" y="277" text-anchor="middle" fill="#7c89a3" font-size="9.5">freshness reload (ensure_fresh)</text>

  <!-- embeddings.py -->
  <rect x="450" y="350" width="220" height="78" rx="10" fill="#0f1e3a" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="381" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">embeddings.py</text>
  <text x="560" y="401" text-anchor="middle" fill="#aab4c6" font-size="10.5">all-MiniLM-L6-v2 · cosine</text>
  <text x="560" y="417" text-anchor="middle" fill="#7c89a3" font-size="9.5">incremental .cache/vectors.npy</text>

  <!-- llm.py (optional, dashed border) -->
  <rect x="450" y="490" width="220" height="78" rx="10" fill="#1c1638" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="560" y="521" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">llm.py</text>
  <text x="560" y="541" text-anchor="middle" fill="#aab4c6" font-size="10.5">DeepSeek · kebab labels + summaries</text>
  <text x="560" y="557" text-anchor="middle" fill="#7c89a3" font-size="9.5">optional · .cache/llm.json</text>
</g>

<!-- ============ APP.PY (fastapi gateway) ============ -->
<g>
  <rect x="800" y="320" width="200" height="120" rx="14" fill="#0e2b25" stroke="#5eead4" stroke-width="2.5" filter="url(#glow-teal)"/>
  <text x="900" y="362" text-anchor="middle" fill="#5eead4" font-size="16" font-weight="700">app.py</text>
  <text x="900" y="384" text-anchor="middle" fill="#5eead4" font-size="11">FastAPI</text>
  <text x="900" y="408" text-anchor="middle" fill="#94a3b8" font-size="10">REST + SSE</text>
  <text x="900" y="424" text-anchor="middle" fill="#7c89a3" font-size="9.5">+ static serving</text>
</g>

<!-- ============ BROWSER (right) ============ -->
<g>
  <rect x="1130" y="180" width="320" height="170" rx="14" fill="#2a1320" stroke="#fb7185" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1290" y="213" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700">browser</text>
  <text x="1290" y="234" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-style="italic">REST + EventSource client</text>

  <!-- REST endpoint chip -->
  <rect x="1150" y="252" width="280" height="36" rx="8" fill="#0a0e1a" stroke="#5eead4" stroke-width="1"/>
  <text x="1290" y="268" text-anchor="middle" fill="#5eead4" font-size="9" font-weight="700">REST</text>
  <text x="1290" y="282" text-anchor="middle" fill="#aab4c6" font-size="8.5">/api/{search · record · sessions · graph · meta}</text>

  <!-- SSE endpoint chip -->
  <rect x="1150" y="298" width="280" height="36" rx="8" fill="#0a0e1a" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1290" y="314" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700">SSE</text>
  <text x="1290" y="328" text-anchor="middle" fill="#aab4c6" font-size="8.5">/api/stream — refresh on growth</text>
</g>

<!-- ============ FRONTEND ASSETS (right, bottom) ============ -->
<g>
  <rect x="1130" y="430" width="320" height="160" rx="14" fill="#0f1626" stroke="#274064" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="1290" y="460" text-anchor="middle" fill="#7c89a3" font-size="11" font-weight="700" letter-spacing="2">FRONTEND ASSETS</text>
  <text x="1290" y="478" text-anchor="middle" fill="#aab4c6" font-size="9.5" font-style="italic">static/ (served by app.py)</text>

  <rect x="1150" y="492" width="120" height="32" rx="6" fill="#102a26" stroke="#5eead4" stroke-width="1"/>
  <text x="1210" y="513" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="600">kb.html</text>

  <rect x="1280" y="492" width="150" height="32" rx="6" fill="#0f1e3a" stroke="#60a5fa" stroke-width="1"/>
  <text x="1355" y="513" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">kb.js (D3 timeline)</text>

  <rect x="1150" y="532" width="130" height="32" rx="6" fill="#1c1638" stroke="#a78bfa" stroke-width="1"/>
  <text x="1215" y="553" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">theme.css</text>

  <rect x="1290" y="532" width="140" height="32" rx="6" fill="#0f1626" stroke="#7c89a3" stroke-width="1"/>
  <text x="1360" y="553" text-anchor="middle" fill="#aab4c6" font-size="11" font-weight="600">index.html</text>
</g>

<!-- ============ EDGES ============ -->
<!-- claude-mem → store.py -->
<line x1="300" y1="365" x2="450" y2="245" stroke="#60a5fa" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="375" y="296" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">records (read-only, live)</text>

<!-- claude-mem → embeddings.py -->
<line x1="300" y1="395" x2="450" y2="389" stroke="#60a5fa" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="375" y="402" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">records</text>

<!-- store.py → app.py -->
<line x1="670" y1="270" x2="800" y2="350" stroke="#5eead4" stroke-width="2" marker-end="url(#ah-teal)"/>
<text x="735" y="303" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600">search</text>

<!-- embeddings.py → app.py -->
<line x1="670" y1="389" x2="800" y2="385" stroke="#5eead4" stroke-width="2" marker-end="url(#ah-teal)"/>
<text x="735" y="380" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600">cosine</text>

<!-- llm.py → app.py (dashed, optional) -->
<line x1="670" y1="510" x2="800" y2="425" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-violet)"/>
<text x="735" y="478" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">labels · summaries</text>

<!-- app.py → browser REST -->
<line x1="1000" y1="360" x2="1130" y2="270" stroke="#5eead4" stroke-width="2.5" marker-end="url(#ah-teal)"/>
<text x="1065" y="304" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600">REST</text>

<!-- app.py → browser SSE (dashed) -->
<line x1="1000" y1="400" x2="1130" y2="316" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-violet)"/>
<text x="1065" y="370" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">SSE</text>

<!-- app.py serves frontend (down arrow, slate) -->
<line x1="900" y1="450" x2="1130" y2="500" stroke="#7c89a3" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah-slate)"/>
<text x="1005" y="490" text-anchor="middle" fill="#7c89a3" font-size="10">serves static</text>

<!-- ============ LEGEND ============ -->
<rect x="0" y="720" width="1500" height="60" fill="#0a0e1a"/>
<line x1="0" y1="720" x2="1500" y2="720" stroke="#1e2740" stroke-width="1"/>

<g transform="translate(40, 738)">
  <line x1="0" y1="6" x2="32" y2="6" stroke="#60a5fa" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="42" y="10" fill="#aab4c6" font-size="11">data ingress</text>
</g>
<g transform="translate(200, 738)">
  <line x1="0" y1="6" x2="32" y2="6" stroke="#5eead4" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="42" y="10" fill="#aab4c6" font-size="11">search / query</text>
</g>
<g transform="translate(370, 738)">
  <line x1="0" y1="6" x2="32" y2="6" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-violet)"/>
  <text x="42" y="10" fill="#aab4c6" font-size="11">optional / async (SSE, LLM)</text>
</g>
<g transform="translate(620, 738)">
  <rect x="0" y="-3" width="14" height="14" rx="3" fill="#0e2b25" stroke="#5eead4" stroke-width="1.5"/>
  <text x="22" y="10" fill="#aab4c6" font-size="11">teal = orchestrator</text>
</g>
<g transform="translate(800, 738)">
  <rect x="0" y="-3" width="14" height="14" rx="3" fill="#1c1638" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="22" y="10" fill="#aab4c6" font-size="11">violet = data / LLM</text>
</g>
<g transform="translate(970, 738)">
  <rect x="0" y="-3" width="14" height="14" rx="3" fill="#0f1e3a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="22" y="10" fill="#aab4c6" font-size="11">blue = embeddings</text>
</g>

<text x="1460" y="765" text-anchor="end" fill="#1e2740" font-size="9">claude-session-kb · arch-diagram</text>
</svg>
</body>
</html>
